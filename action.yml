name: "Upload Distribution"
description: "Uploads .deb packages to Firebase or backend"
inputs:
  file:
    description: "Path to the file to upload"
    required: true
  version:
    description: "Version of the package"
    required: true
  architecture:
    description: "Target architecture (e.g., amd64)"
    required: true
  token:
    description: "DAISYTUNER_API_TOKEN"
    required: true
  url:
    description: "REST API URL for the backend"
    required: true
  os:
    description: "Target operating system (e.g., linux, darwin)"
    required: false
  dist-id:
    description: "Distribution ID (e.g., ubuntu, debian, rhel)"
    required: false
  dist-version:
    description: "Distribution version (e.g., 24.04, 13, 10.1)"
    required: false
  dist-platform-id:
    description: "Distribution platform ID (e.g., platform:el10 for rhel 10 and sister distros)"
    required: false

runs:
  using: "node20"
  main: "dist/index.js"